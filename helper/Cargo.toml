[package]
name = "codex-cove"
version = "0.5.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local Codex Cove launcher, hook, broker, and management helper"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
