name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH) on the default branch
        required: true
        type: string
      confirm:
        description: Type RELEASE followed by the exact tag (for example, RELEASE v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_ZIGBUILD_VERSION: 0.23.0
  COVE_RUSTUP_TOOLCHAIN: 1.97.1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: 1.97.1

jobs:
  preflight:
    name: Verify release candidate
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.tag.outputs.tag }}
      release-version: ${{ steps.tag.outputs.version }}
      source-sha: ${{ steps.tag.outputs.source-sha }}

    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify existing release tag
        id: tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Dispatch releases from the protected default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [[ "$RELEASE_CONFIRM" != "RELEASE $RELEASE_TAG" ]]; then
            echo "Release confirmation must be exactly: RELEASE $RELEASE_TAG" >&2
            exit 1
          fi

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_sha="$(./scripts/resolve-github-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG")"
          git cat-file -e "$source_sha^{commit}"
          if ! git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"; then
            echo "$RELEASE_TAG is not on the dispatched $DEFAULT_BRANCH commit." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.tag.outputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(./scripts/resolve-github-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG")" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Verify completed release candidate
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          CODEX_COVE_REQUIRE_RECORDED_STRICT_VERIFY=1 \
            VERSION="$RELEASE_VERSION" \
            make verify-release-readiness

      - name: Install locked dependencies
        run: make deps

      - name: Run release tests and static checks
        shell: bash
        run: |
          set -euo pipefail
          make test
          cargo fmt --manifest-path helper/Cargo.toml --all -- --check
          cargo clippy \
            --locked \
            --manifest-path helper/Cargo.toml \
            --all-targets \
            --all-features \
            -- \
            -D warnings

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *zsh*) zsh -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done < <(find scripts Tests -type f -name '*.sh' -print | LC_ALL=C sort)

      - name: Install cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zig >/dev/null 2>&1; then
            brew install zig
          fi
          cargo install cargo-zigbuild \
            --locked \
            --version "$CARGO_ZIGBUILD_VERSION"

      - name: Cross-build and verify remote helpers
        shell: bash
        run: |
          set -euo pipefail
          make remote-artifacts
          expected_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' helper/Cargo.toml | head -n 1)"
          test -n "$expected_version"
          test "$(lipo -archs build/remote/aarch64-apple-darwin/codex-cove)" = arm64
          test "$(lipo -archs build/remote/x86_64-apple-darwin/codex-cove)" = x86_64
          file build/remote/aarch64-unknown-linux-musl/codex-cove | grep -F 'ELF 64-bit LSB executable, ARM aarch64'
          file build/remote/x86_64-unknown-linux-musl/codex-cove | grep -F 'ELF 64-bit LSB executable, x86-64'
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl; do
            LC_ALL=C grep -aF "codex-cove $expected_version" \
              "build/remote/$target/codex-cove" >/dev/null
          done
          (
            cd build/remote
            shasum -a 256 -c SHA256SUMS
          )

  build-release:
    name: Sign, notarize, and assemble
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 75
    environment: release
    permissions:
      contents: read

    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable build input
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release-tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(./scripts/resolve-github-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG")" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Validate required release credentials
        shell: bash
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "Release requires all MACOS_CERTIFICATE_* and MACOS_SIGNING_IDENTITY secrets." >&2
            exit 1
          fi
          if [[ -z "$APPLE_NOTARY_APPLE_ID" || -z "$APPLE_NOTARY_PASSWORD" || -z "$APPLE_NOTARY_TEAM_ID" ]]; then
            echo "Release requires all APPLE_NOTARY_* secrets." >&2
            exit 1
          fi
          if [[ "$MACOS_SIGNING_IDENTITY" != "Developer ID Application: "* ]]; then
            echo "MACOS_SIGNING_IDENTITY must name a Developer ID Application identity." >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: make deps

      - name: Install cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zig >/dev/null 2>&1; then
            brew install zig
          fi
          cargo install cargo-zigbuild \
            --locked \
            --version "$CARGO_ZIGBUILD_VERSION"

      - name: Import Developer ID identity
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/codex-cove-signing.p12"
          keychain_path="$RUNNER_TEMP/codex-cove-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "\"$MACOS_SIGNING_IDENTITY\""

      - name: Build timestamped distribution bundle
        shell: bash
        env:
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          CODEX_COVE_DISTRIBUTION_BUILD: "1"
          CODEX_COVE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          COVE_RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          set -euo pipefail
          make package-with-remote
          (
            cd 'build/Codex Cove.app/Contents/Resources/remote'
            shasum -a 256 -c SHA256SUMS
          )

          signature_details="$(codesign -dv --verbose=4 'build/Codex Cove.app' 2>&1)"
          printf '%s\n' "$signature_details" | grep '^Authority=Developer ID Application: ' >/dev/null
          printf '%s\n' "$signature_details" | grep '^Timestamp=' >/dev/null
          actual_team_id="$(printf '%s\n' "$signature_details" | sed -n 's/^TeamIdentifier=//p')"
          if [[ "$actual_team_id" != "$APPLE_NOTARY_TEAM_ID" ]]; then
            echo "Signing TeamIdentifier does not match APPLE_NOTARY_TEAM_ID." >&2
            exit 1
          fi

      - name: Reverify frozen source candidate
        run: make candidate-verify

      - name: Notarize and staple app
        shell: bash
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          notary_archive="$RUNNER_TEMP/Codex-Cove-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            'build/Codex Cove.app' \
            "$notary_archive"
          xcrun notarytool submit "$notary_archive" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple 'build/Codex Cove.app'
          xcrun stapler validate 'build/Codex Cove.app'
          spctl --assess --type execute --verbose=4 'build/Codex Cove.app'

      - name: Prepare canonical release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.release-version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION" make release-assets

      - name: Remove imported signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/codex-cove-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/codex-cove-signing.p12"

      - name: Upload assembled release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: build/release/${{ needs.preflight.outputs.release-version }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest public release assets
    if: github.event.repository.visibility == 'public'
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download assembled release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-checksums: dist/SHA256SUMS

  publish:
    name: Publish GitHub release
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.build-release.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    needs:
      - preflight
      - build-release
      - attest
    runs-on: macos-26
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download assembled release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist

      - name: Verify immutable release target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(./scripts/resolve-github-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG")" = "$SOURCE_SHA"

      - name: Stage, verify, and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; refusing to replace published assets." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Codex Cove $RELEASE_TAG"

          test "$(./scripts/resolve-github-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG")" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p release-verification
          gh release download "$RELEASE_TAG" --dir release-verification
          (
            cd dist
            find . -maxdepth 1 -type f -print | LC_ALL=C sort | while IFS= read -r asset; do
              shasum -a 256 "$asset"
            done
          ) > "$RUNNER_TEMP/local-release-SHA256SUMS"
          (
            cd release-verification
            find . -maxdepth 1 -type f -print | LC_ALL=C sort | while IFS= read -r asset; do
              shasum -a 256 "$asset"
            done
          ) > "$RUNNER_TEMP/uploaded-release-SHA256SUMS"
          diff -u \
            "$RUNNER_TEMP/local-release-SHA256SUMS" \
            "$RUNNER_TEMP/uploaded-release-SHA256SUMS"
          (
            cd release-verification
            shasum -a 256 -c SHA256SUMS
          )

          test "$(./scripts/resolve-github-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG")" = "$SOURCE_SHA"
          gh release edit "$RELEASE_TAG" --draft=false
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" = true
          test "$(./scripts/resolve-github-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG")" = "$SOURCE_SHA"

  update-homebrew-cask:
    name: Stage Homebrew cask update
    if: github.event.repository.visibility == 'public'
    needs:
      - preflight
      - publish
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out the current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download assembled release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist

      - name: Verify the public immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" = true
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          resolved_tag_sha="$(
            git show "$SOURCE_SHA:scripts/resolve-github-tag.sh" |
              sh -s -- "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          )"
          test "$resolved_tag_sha" = "$SOURCE_SHA"

          mkdir published-release
          gh release download "$RELEASE_TAG" --dir published-release
          (
            cd published-release
            shasum -a 256 -c SHA256SUMS
          )
          cmp -s dist/codex-cove.rb published-release/codex-cove.rb
          ./scripts/verify-homebrew-cask-release.sh \
            dist/codex-cove.rb \
            published-release

      - name: Audit and stage the exact cask artifact
        id: cask-update
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release-tag }}
        run: |
          set -euo pipefail
          update_branch="automation/homebrew-$RELEASE_TAG"
          candidate_version="$(./scripts/read-homebrew-cask-version.sh published-release/codex-cove.rb)"
          if [[ "v$candidate_version" != "$RELEASE_TAG" ]]; then
            echo "Released cask version $candidate_version does not match $RELEASE_TAG." >&2
            exit 1
          fi

          cask_already_existed=false
          if [[ -e Casks/codex-cove.rb || -L Casks/codex-cove.rb ]]; then
            ./scripts/read-homebrew-cask-version.sh Casks/codex-cove.rb >/dev/null
            cask_already_existed=true
            if ! cmp -s Casks/codex-cove.rb published-release/codex-cove.rb; then
              ./scripts/verify-homebrew-cask-update.sh \
                Casks/codex-cove.rb \
                published-release/codex-cove.rb
            fi
          else
            ./scripts/verify-homebrew-cask-update.sh \
              Casks/codex-cove.rb \
              published-release/codex-cove.rb
          fi
          mkdir -p Casks
          cp published-release/codex-cove.rb Casks/codex-cove.rb
          cmp -s published-release/codex-cove.rb Casks/codex-cove.rb
          git add Casks/codex-cove.rb
          git diff --cached --check

          audit_repository="$RUNNER_TEMP/homebrew-cask-audit"
          mkdir -p "$audit_repository/Casks"
          cp published-release/codex-cove.rb "$audit_repository/Casks/codex-cove.rb"
          cmp -s published-release/codex-cove.rb "$audit_repository/Casks/codex-cove.rb"
          git -C "$audit_repository" init -q
          git -C "$audit_repository" add Casks/codex-cove.rb
          git -C "$audit_repository" \
            -c user.name='Codex Cove Release Audit' \
            -c user.email='audit@example.invalid' \
            -c commit.gpgsign=false \
            commit -qm 'audit exact released cask'

          audit_tap='codexcoveaudit/codex-cove'
          cleanup_audit_tap() {
            HOMEBREW_NO_AUTO_UPDATE=1 brew untap "$audit_tap" >/dev/null 2>&1 || true
          }
          trap cleanup_audit_tap EXIT
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap "$audit_tap" "$audit_repository"
          tapped_cask="$(brew --repository)/Library/Taps/codexcoveaudit/homebrew-codex-cove/Casks/codex-cove.rb"
          cmp -s published-release/codex-cove.rb "$tapped_cask"
          HOMEBREW_NO_AUTO_UPDATE=1 brew style --cask "$audit_tap/codex-cove"
          if [[ "$cask_already_existed" == false ]]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew audit --cask --new "$audit_tap/codex-cove"
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew audit --cask --strict --online "$audit_tap/codex-cove"
          fi
          cleanup_audit_tap
          trap - EXIT

          if git diff --cached --quiet; then
            local_sha=$(git rev-parse HEAD)
            echo "status=already-landed" >> "$GITHUB_OUTPUT"
            echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "compare-url=https://github.com/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "head-sha=$local_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$update_branch" >/dev/null 2>&1; then
            remote_ref="refs/remotes/origin/$update_branch"
            git fetch --no-tags origin "refs/heads/$update_branch:$remote_ref"
            git show "$remote_ref:Casks/codex-cove.rb" > "$RUNNER_TEMP/remote-codex-cove.rb"
            cmp -s published-release/codex-cove.rb "$RUNNER_TEMP/remote-codex-cove.rb"
            test "$(git diff --name-only "$DEFAULT_BRANCH...$remote_ref")" = Casks/codex-cove.rb
            remote_sha=$(git rev-parse "$remote_ref")
            compare_url="https://github.com/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$update_branch?expand=1"
            echo "status=existing-branch" >> "$GITHUB_OUTPUT"
            echo "branch=$update_branch" >> "$GITHUB_OUTPUT"
            echo "compare-url=$compare_url" >> "$GITHUB_OUTPUT"
            echo "head-sha=$remote_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch --create "$update_branch"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(homebrew): update cask for $RELEASE_TAG"
          git push origin "HEAD:refs/heads/$update_branch"

          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/$update_branch" | awk '{ print $1 }')
          test "$remote_sha" = "$local_sha"

          compare_url="https://github.com/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$update_branch?expand=1"
          echo "status=new-branch" >> "$GITHUB_OUTPUT"
          echo "branch=$update_branch" >> "$GITHUB_OUTPUT"
          echo "compare-url=$compare_url" >> "$GITHUB_OUTPUT"
          echo "head-sha=$local_sha" >> "$GITHUB_OUTPUT"

      - name: Summarize the manual merge handoff
        shell: bash
        env:
          COMPARE_URL: ${{ steps.cask-update.outputs.compare-url }}
          HEAD_SHA: ${{ steps.cask-update.outputs.head-sha }}
          HANDOFF_STATUS: ${{ steps.cask-update.outputs.status }}
          UPDATE_BRANCH: ${{ steps.cask-update.outputs.branch }}
        run: |
          case "$HANDOFF_STATUS" in
            already-landed)
              {
                echo '### Homebrew cask already landed'
                echo
                echo "The default branch already contains the exact released Cask at \`$HEAD_SHA\`."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            existing-branch | new-branch)
              {
                echo '### Homebrew cask update ready'
                echo
                echo "- Branch: \`$UPDATE_BRANCH\`"
                echo "- Commit: \`$HEAD_SHA\`"
                echo "- Review and open a pull request: [$COMPARE_URL]($COMPARE_URL)"
                echo
                echo 'This workflow does not open or merge the pull request automatically.'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Unknown Homebrew handoff status: $HANDOFF_STATUS" >&2
              exit 1
              ;;
          esac
